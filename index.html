<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Облік проведених пар і розкладка паперового журналу для викладачів КФК СумДУ">
</head>
<body>
<title>Журнал викладача</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: шапка з вкладками, нижче робоча зона одного розділу; розкладка журналу — розвороти з двох сторінок, як у паперовому журналі. */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --ink:#1b2340; --mut:#5d6684; --rule:#d6dcee; --rule2:#e9edf7;
  --accent:#2347b8; --accent-ink:#ffffff; --work:#e4ecff; --att:#fff0cf; --fin:#dff3e4; --plan:#f1f2f6;
  --done:#1f7a4d; --cancel:#b3261e; --warn:#a86500;
  --f-head:"Manrope",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11131b; --sheet:#181b26; --ink:#e7eaf5; --mut:#9aa2bf; --rule:#2c3247; --rule2:#222737;
  --accent:#7c9cff; --accent-ink:#0d1330; --work:#1f2a4a; --att:#3a2f14; --fin:#163024; --plan:#1d2030;
  --done:#5fd39a; --cancel:#ff8a80; --warn:#f0b35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11131b; --sheet:#181b26; --ink:#e7eaf5; --mut:#9aa2bf; --rule:#2c3247; --rule2:#222737;
  --accent:#7c9cff; --accent-ink:#0d1330; --work:#1f2a4a; --att:#3a2f14; --fin:#163024; --plan:#1d2030;
  --done:#5fd39a; --cancel:#ff8a80; --warn:#f0b35a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-body);padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 24px/1.1 var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 18px/1.2 var(--f-head);margin:0;text-wrap:balance}
h3{font:700 15px/1.2 var(--f-head);margin:0}
.sub{color:var(--mut);font-size:13px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:600 14px var(--f-body);color:var(--mut);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);min-width:0}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{font-family:var(--f-mono);font-size:13px;min-height:220px;resize:vertical}
input[type=checkbox]{width:auto}
button.b{font:600 13px var(--f-body);border-radius:6px;padding:7px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
label.b{font:600 13px var(--f-body);border-radius:6px;padding:7px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);display:inline-block}
button.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.b.ghost{background:none}
button.b:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:24px;text-align:center;color:var(--mut);display:flex;flex-direction:column;gap:10px;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font:600 11px var(--f-body);letter-spacing:.02em;border:1px solid currentColor}
.pill.att{color:var(--warn)}
.attsep{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--att);border-radius:6px;padding:4px 10px;margin:4px 0;font-size:13px}
.lp td .wn{font-weight:700;margin-inline-start:8px}
button.att-b[aria-pressed="true"]{background:var(--att);border-color:var(--warn);color:var(--ink)}
.pill.done{color:var(--done)} .pill.planned{color:var(--mut)} .pill.cancelled{color:var(--cancel)}
.lessons{display:flex;flex-direction:column}
.lesson{display:grid;grid-template-columns:2.4rem 4.6rem 2rem minmax(0,1fr) minmax(0,.6fr) 4.6rem auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule2)}
.lesson.cancelled{opacity:.55}
.lesson.cancelled .topic{text-decoration:line-through}
.lesson .n{color:var(--mut);text-align:right}
.lesson .acts{display:flex;gap:4px}
.lesson input{padding:5px 7px;font-size:13px}
.lesson .wl{font-family:var(--f-mono)}
.lhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--rule)}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tcard{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sheet)}
.tcard .when{font-family:var(--f-mono);color:var(--mut);font-size:12px}
.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--sheet)}
.spread>h3{grid-column:1/-1;color:var(--mut)}
.lp{overflow-x:auto}.lp table{border-collapse:collapse;width:100%;min-width:420px;table-layout:fixed}
.lp td{border:1px solid var(--rule);height:92px;vertical-align:bottom;text-align:center;padding:2px 0}
.lp td div{writing-mode:vertical-rl;transform:rotate(180deg);font:12px var(--f-mono);margin:0 auto;white-space:nowrap}
.lp tr.num td{height:auto;font-size:10px;color:var(--mut);vertical-align:middle}
td.work{background:var(--work)} td.att,td.reta{background:var(--att)} td.fin{background:var(--fin)} td.plan{background:var(--plan);color:var(--mut)}
td.ret div{color:var(--mut);font-style:italic}
.rp{overflow-x:auto}.rp table{border-collapse:collapse;width:100%}.rp th,.rp td{border:1px solid var(--rule);padding:3px 6px;font-size:12px;text-align:left;vertical-align:top}
.rp th{color:var(--mut);font-weight:600}.rp td.c{text-align:center;white-space:nowrap;font-family:var(--f-mono)}
.rp tr.p td{color:var(--mut)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}.legend span{border:1px solid var(--rule);border-radius:4px;padding:2px 8px}
.note{color:var(--mut);font-size:13px;max-width:70ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
.sched{display:flex;flex-direction:column;gap:6px}
.sched .r{display:grid;grid-template-columns:10rem 7rem 9rem max-content;gap:6px}
details.tool{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper)}
details.tool>summary{cursor:pointer;font:700 14px var(--f-head)}
details.tool[open]>summary{margin-bottom:10px}
details.tool .tbody{display:flex;flex-direction:column;gap:10px}
.prev{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto;border:1px solid var(--rule2);border-radius:6px;padding:8px;background:var(--sheet)}
.prev label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink)}
.prev .pl{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:8px;font-size:13px;border-bottom:1px solid var(--rule2);padding:2px 0}
.op-add,.op-restore{color:var(--done)} .op-cancel{color:var(--cancel)} .op-done{color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:8px;text-align:left;max-width:62ch;margin:0 auto;padding:0;list-style:none;counter-reset:s}
.steps.left{margin:0}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);font:700 12px var(--f-mono);color:var(--accent-ink);background:var(--accent);border-radius:50%;width:22px;height:22px;flex:none;display:grid;place-items:center}
.lesson button.d{background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;font-family:var(--f-mono);font-size:14px}
.lesson button.d:hover{text-decoration:underline}
form.mv{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:6px 0 10px 2.4rem;border-bottom:1px solid var(--rule2)}
.cl{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px solid var(--rule2);padding:8px 0}
a{color:var(--accent)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{background:none;border:1px solid transparent;border-radius:6px;padding:5px 10px;font:600 13px var(--f-body);color:var(--mut);cursor:pointer}
.subtabs button[aria-current="page"]{color:var(--ink);background:var(--sheet);border-color:var(--rule)}
[hidden]{display:none!important}
.foot{color:var(--mut);font-size:12px;line-height:1.5;border-top:1px solid var(--rule);padding-top:12px;max-width:80ch}
.about{display:flex;flex-direction:column;gap:8px;font-size:13px;max-width:72ch}.about p{margin:0}
.todo{display:flex;flex-direction:column}
.todo>div{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule2);padding:6px 0}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule2);padding-top:12px}
.danger{display:flex;justify-content:flex-end;border-top:1px solid var(--rule2);padding-top:12px}

.empty .start{display:flex;flex-direction:column;gap:6px;width:min(100%,30rem);text-align:left}
label.f.who{font-size:13px;color:var(--ink);font-weight:600}
label.f.who select{font-size:15px;padding:9px 10px}
details.tool.inner{background:var(--sheet)}
@media (max-width:760px){.cl{grid-template-columns:auto minmax(0,1fr)}.cl>label{grid-column:2}form.mv{padding-left:0}}
@media (max-width:760px){
  .spread{grid-template-columns:minmax(0,1fr)}
  .lesson{grid-template-columns:2rem 4.2rem minmax(0,1fr) auto;grid-template-areas:"n d t a" ". . h w"}
  .lesson .pair{display:none}.lesson .n{grid-area:n}.lesson .d{grid-area:d}.lesson .topic{grid-area:t}.lesson .hw{grid-area:h}.lesson .wl{grid-area:w}.lesson .acts{grid-area:a}
  .lhead{display:none}
  .sched .r{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Журнал викладача</h1>
      <div class="sub" id="who">Облік проведених пар і розкладка паперового журналу</div>
    </div>
    <div class="sub mono" id="status">завантаження…</div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Розділи">
    <button role="tab" id="t-today" aria-selected="true">Сьогодні</button>
    <button role="tab" id="t-courses" aria-selected="false">Дисципліни</button>
    <button role="tab" id="t-settings" aria-selected="false">Налаштування</button>
  </nav>

  <div class="chips" id="courseChips" hidden></div>
  <nav class="subtabs" id="subnav" aria-label="Дисципліна" hidden>
    <button id="u-lessons" aria-current="page">Пари</button>
    <button id="u-layout">Журнал для друку</button>
    <button id="u-course">План і розклад</button>
  </nav>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script id="zh-parsers">
/* Парсери «Журналу викладача». Чисті функції без DOM: підключаються в сторінку й тестуються в node. */
(function(root){
"use strict";
const MARK=/^(Л|ЛЗ|ПЗ|ПР|ЛР|СР|СРС|ІЗ|МК|ТК|Т)\s*(\d+)\s*[.)]\s*(.*)$/i;
function norm(s){return String(s||'').replace(/ /g,' ').replace(/[ \t]+/g,' ').trim();}

/* Силабус КФК (єдина форма): перелік занять — у розділі «7.1 Види навчальних занять»
   СЕМЕСТР N → Змістовий модуль → Тема → пункти «Л 1.», «ПЗ 2.», «ЛР 3.». Кінець — «7.2» або «8. Методи». */
function parseSyllabus(text){
  const lines=String(text).split(/\r?\n/).map(norm).filter(Boolean);
  let start=lines.findIndex(l=>/^7\.?\s*1\.?\s*Види навчальних занять/i.test(l));
  if(start<0) start=lines.findIndex(l=>/^7\.?\s*Види навчальних занять/i.test(l));
  if(start<0) start=0;                                // не той формат — шукаємо пункти по всьому тексту
  const sems=[]; let sem=null, mod='', theme='', last=null, modWait=false;
  const ensureSem=n=>{ sem=sems.find(s=>s.n===n); if(!sem){ sem={n,items:[]}; sems.push(sem);} };
  for(let i=start+1;i<lines.length;i++){
    const l=lines[i]; let m;
    if(/^7\.?\s*2\.?\s*Види навчальної діяльності|^8\.?\s*Методи/i.test(l)) break;
    if((m=l.match(/^СЕМЕСТР\s*(\d+)\.?\s*(.*)$/i))){ ensureSem(+m[1]); last=null; const r=m[2]; if((m=r.match(/^Змістовий модуль\s*(\d+)\.?\s*(.*)$/i))){ mod='ЗМ'+m[1]+(m[2]?'. '+m[2]:''); modWait=!m[2]; } continue; }
    if((m=l.match(/^Змістовий модуль\s*(\d+)\.?\s*(.*)$/i))){ mod='ЗМ'+m[1]+(m[2]?'. '+m[2]:''); modWait=!m[2]; last=null; continue; }
    if((m=l.match(/^Тема\s*(\d+)\.?\s*(.*)$/i))){ theme='Тема '+m[1]+'. '+norm(m[2]); last=null; modWait=false; continue; }
    if((m=l.match(MARK))){
      if(!sem) ensureSem(0);
      const it={kind:m[1].toUpperCase(),n:+m[2],title:norm(m[3]),theme,module:mod};
      sem.items.push(it); last=it; modWait=false; continue;
    }
    if(modWait && l===l.toUpperCase() && /[А-ЯІЇЄҐ]/.test(l)){ mod+='. '+l; modWait=false; continue; }
    // продовження назви пункту, перенесене на новий рядок (PDF, комірки Word)
    if(last && l.length<220 && !/^\d+\.?$/.test(l) && (/^[а-яіїєґa-z(«"0-9–-]/.test(l) || /[,–-]$/.test(last.title) || /(^|\s)[а-яіїєґa-z]{1,3}$/.test(last.title) || !last.title)) last.title=norm(last.title+' '+l);
  }
  return sems.filter(s=>s.items.length).map(s=>{const seen=new Set(); s.items=s.items.filter(x=>{const k=x.kind+x.n+x.title; if(seen.has(k)) return false; seen.add(k); return true;}); return s;});
}
function planFromSemester(sem){
  return sem.items.filter(it=>!/^(СР|СРС)$/.test(it.kind)).map(it=>{
    const k=it.kind;
    const label = (k==='Л'||k==='ЛЗ') ? 'Л' : (k==='Т'||k==='ТК'||k==='МК') ? 'Т' : (k==='ПР'?'ПЗ':k)+it.n;
    const pref = (k==='Л'||k==='ЛЗ') ? 'Л'+it.n : (k==='ПР'?'ПЗ':k)+it.n;
    const t=it.title.replace(/\.$/,'');
    const hw = label==='Л' ? 'Конспект '+pref : (/^(ПЗ|ЛР|ІЗ)/.test(label) ? 'Звіт '+pref : '');
    return {label, title: pref+'. '+t, hw, theme: it.theme||'', module: it.module||''};
  });
}

/* Розклад викладача з сайту КФК (скопійована таблиця): Предмет | Викладач | Група | Ауд. | Пара | День */
const DAYS={'пн':1,'вт':2,'ср':3,'чт':4,'пт':5,'сб':6};
function parseTeacherSchedule(text){
  const rows=[];
  String(text).split(/\r?\n/).forEach(line=>{
    let cs=line.split('\t').map(norm);
    if(cs.length<5) cs=line.split(/\s{2,}|\|/).map(norm).filter(x=>x!=='');
    if(cs.length<5) return;
    if(/^предмет$/i.test(cs[0])) return;
    const dayCell=cs[cs.length-1].toLowerCase().replace('.','').slice(0,2);
    const dow=DAYS[dayCell]; const pair=parseInt(cs[cs.length-2],10);
    if(!dow||!pair) return;
    let subj=cs[0], parity='all';
    const PM=/\(\s*(чис|знам)[а-яіїєґ.]*\s*[()]?/i, pm=subj.match(PM);   // «(чисельник)», «(знаменник )», описка «(знаменник(»
    if(pm) parity=/^чис/i.test(pm[1])?'num':'den';
    subj=norm(subj.replace(new RegExp(PM.source,'ig'),''));
    const group=cs[2]||'', aud=cs.length>=6?cs[3]:'';
    rows.push({subject:subj,group,aud,pair,dow,parity});
  });
  // зливаємо однакові слоти для кількох груп (731 і 733 в одній парі)
  const m=new Map();
  rows.forEach(r=>{const k=[r.subject.toLowerCase().replace(/[^а-яіїєґa-z]/g,''),r.dow,r.pair,r.parity].join('|'); if(!m.has(k)) m.set(k,{...r,groups:[]}); const x=m.get(k); if(r.group&&!x.groups.includes(r.group)) x.groups.push(r.group); if(!x.aud&&r.aud) x.aud=r.aud;});
  return [...m.values()].map(x=>({subject:x.subject,groups:x.groups.join('/'),aud:x.aud,pair:x.pair,dow:x.dow,parity:x.parity}));
}
function subjectsOf(slots){ const s=new Map(); slots.forEach(x=>{const k=x.subject.toLowerCase().replace(/[^а-яіїєґa-z]/g,''); if(!s.has(k)) s.set(k,{subject:x.subject,groups:new Set(),slots:[]}); const e=s.get(k); x.groups.split('/').forEach(g=>g&&e.groups.add(g)); e.slots.push(x);}); return [...s.values()].map(e=>({subject:e.subject,groups:[...e.groups].join('/'),slots:e.slots})); }

/* Перелік дат від навчальної частини: «05.09», «05.09.2026», «5.09 3 пара», «2026-09-05», через кому чи з нового рядка */
function parseDateList(text,year){
  const out=[]; const re=/(\d{4})-(\d{2})-(\d{2})|(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?:[^\d\n,;]{0,6}(\d)\s*(?:пара|п\.?)?)?/g; let m;
  while((m=re.exec(String(text)))){
    let y,mo,d,pair=null;
    if(m[1]){y=+m[1];mo=+m[2];d=+m[3];}
    else{d=+m[4];mo=+m[5];y=m[6]?(m[6].length===2?2000+(+m[6]):+m[6]):(year||(mo>=8?2026:2027)); if(m[7]) pair=+m[7];}
    if(mo<1||mo>12||d<1||d>31) continue;
    out.push({date:y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'),pair});
  }
  const seen=new Set(); return out.filter(x=>{const k=x.date+'|'+(x.pair||''); if(seen.has(k)) return false; seen.add(k); return true;});
}

/* Заміни зі сторінки КФК (скопійована таблиця): Група | Пара | Було | Заміна | Ауд.
   Пара: «1-2», «7-8», «5-8» (академічні години коледжу → пари 1, 4, 3–4) або «2 пара» (бакалаври). */
function parseSubstitutions(text){
  const out=[];
  for(const line of String(text).split(/\r?\n/)){
    if(/^\s*Заміна аудиторій/i.test(line)) break;           // друга таблиця — лише аудиторії
    const cs=line.split('\t').map(norm);
    if(cs.length<4) continue;
    let pairs=[]; const pm=cs[1].match(/^(\d+)\s*-\s*(\d+)$/), pb=cs[1].match(/^(\d+)\s*(?:-\s*(\d+)\s*)?пар/i);
    if(pm){ const a=Math.ceil(+pm[1]/2), b=Math.ceil(+pm[2]/2); for(let k=a;k<=b;k++) pairs.push(k); }
    else if(pb){ const a=+pb[1], b=pb[2]?+pb[2]:a; for(let k=a;k<=b;k++) pairs.push(k); }
    else continue;
    const groups=cs[0].split(/[,;]\s*/).map(norm).filter(Boolean);
    pairs.forEach(pair=>out.push({groups,pair,from:cs[2],to:cs[3],aud:cs[4]||''}));
  }

}
const isFree=s=>/^(вільн|—|-|$)/i.test(norm(s));
function groupTokens(s){ return String(s||'').split(/[\/,;\s]+/).map(x=>x.toLowerCase().replace(/[^0-9a-zа-яіїєґ-]/g,'')).filter(Boolean); }

function substitutionEffect(row,course,teacher){
  if(!groupsOverlap(row.groups.join(','),course.groups)) return null;
  const mineFrom=!isFree(row.from) && nameMatch(row.from.replace(/\(.*?\)/g,''),course.title);
  const hasT=/\(.*?\)/.test(row.to);
  const mineTo=!isFree(row.to) && nameMatch(row.to.replace(/\(.*?\)/g,''),course.title) && (!hasT || !teacher || teacherIn(row.to,teacher));
  if(mineTo && !mineFrom) return 'add';
  if(mineFrom && !mineTo) return 'cancel';
  return null;
}
/* Слоти розкладу → курси: та сама дисципліна (з поправкою на описки) і той самий потік груп */
function clusterCourses(slots){
  const cl=[];
  const tok=g=>groupTokens(g);
  slots.forEach(s=>{
    const T=tok(s.groups);
    // та сама дисципліна (з поправкою на описки) і групи перетинаються: 731 і 731/733 — один потік
    let c=cl.find(x=>nameMatch(x.subject,s.subject) && x.toks.some(t=>T.includes(t)));
    if(!c){ c={subject:s.subject,toks:[],names:{},aud:s.aud,slots:[]}; cl.push(c); }
    s.groups.split('/').forEach(g=>{const k=tok(g)[0]; if(k&&!c.toks.includes(k)){c.toks.push(k);c.names[k]=g.trim();}});
    if(s.subject.length>c.subject.length) c.subject=s.subject;   // повніша назва, без описки
    if(!c.slots.some(x=>x.dow===s.dow&&x.pair===s.pair&&x.parity===s.parity)) c.slots.push({dow:s.dow,pair:s.pair,parity:s.parity});
    if(!c.aud&&s.aud) c.aud=s.aud;
  });
  return cl.map(c=>{ c.slots.sort((a,b)=>a.dow-b.dow||a.pair-b.pair); const ks=c.toks.slice().sort(); return {subject:c.subject,groups:ks.map(k=>c.names[k]).join('/'),gkey:ks.join('/'),aud:c.aud,slots:c.slots}; });
}
function nameMatch(a,b){
  const t=s=>norm(s).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^а-яіїєґa-z ]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const A=t(a),B=t(b); if(!A.length||!B.length) return false;
  const ini=w=>w.map(x=>x[0]).join(''), ab=s=>{const x=norm(s).replace(/\(.*?\)/g,'').trim(); return /^[А-ЯІЇЄҐA-Z]{2,6}$/.test(x)?x.toLowerCase():'';};
  if(ab(a)&&ab(a)===ini(B)) return true; if(ab(b)&&ab(b)===ini(A)) return true;
  const hit=A.filter(w=>B.some(v=>v.startsWith(w.slice(0,5))||w.startsWith(v.slice(0,5)))).length;
  return hit>=Math.min(2,A.length,B.length) || (A.length===1&&hit===1);

/* ---------- lessons logic ---------- */
function sorted(c){return c.lessons.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.pair||0)-(b.pair||0));}

}
/* Теми майбутніх пар ідуть за планом по черзі. Після скасування, заміни чи перенесення черга зсувається.
   Проведені пари й пари з темою, яку викладач вписав сам (custom), не чіпаємо. */
function reflow(c,start){
  const plan=c.plan||[]; if(!plan.length) return;
  const L=sorted(c);
  if(typeof start!=='number'){
    let m=Infinity; L.forEach(l=>{ if(l.status!=='done'&&typeof l.planIdx==='number'&&l.planIdx<m) m=l.planIdx; });
    start=m===Infinity?nextPlanIdx(c):m;
  }
  let idx=start;
  L.forEach(l=>{
    if(l.status==='done') return;
    if(l.status==='cancelled'){ l.planIdx=null; return; }
    if(l.custom) return;
    const p=plan[idx]; idx++;
    if(p){ l.topic=p.title; l.hw=p.hw||''; l.work=isWork(p.label)?p.label:''; l.planIdx=idx-1; return; }
    // план скінчився: тему, яку викладач вписав сам (не з плану), лишаємо; решта — резерв
    if(typeof l.planIdx!=='number' && l.topic && !/^Резерв/i.test(l.topic)) return;
    if(!/^Резерв/i.test(l.topic||'')) l.topic='Резерв / консультація'; l.hw=''; l.work=''; l.planIdx=null;
  });
}
/* З якого заняття нового плану продовжувати: за номерами робіт у темах проведених пар («ЛР5», «Л14–Л15», «ПЗ6»),
   бо проведені пари рідко збігаються з нумерацією силабусу один до одного. Інакше — проведено + 1. */
function suggestStart(c,plan){
  const code=t=>{const m=String(t).match(/^(ЛР|ПЗ|ІЗ|Л)\s*(\d+)/i); return m?m[1].toUpperCase()+m[2]:null;};
  const codes=plan.map(p=>code(p.title)); let best=-1;
  c.lessons.forEach(l=>{ if(l.status!=='done') return;
    (String(l.topic||'').toUpperCase().match(/(?<![А-ЯІЇЄҐA-Z])(ЛР|ПЗ|ІЗ|Л)\s*\d+/g)||[]).forEach(t=>{const i=codes.indexOf(t.replace(/\s+/g,'')); if(i>best) best=i;}); });
  if(best>=0) return {start:best+2,by:codes[best]};
  return {start:Math.min(c.lessons.filter(l=>l.status==='done').length+1,plan.length+1)};
}
/* Переписати теми всіх пар, і проведених теж, за планом по черзі (коли в журнал потрапили теми іншої дисципліни). */
function rewriteAll(c){
  const plan=c.plan||[]; let idx=0;
  sorted(c).forEach(l=>{
    if(l.status==='cancelled'){ l.planIdx=null; return; }
    const p=plan[idx++]; l.custom=false;
    if(p){ l.topic=p.title; l.hw=p.hw||''; l.work=isWork(p.label)?p.label:''; l.planIdx=idx-1; return; }
    if(!/^Резерв/i.test(l.topic||'')) l.topic='Резерв / консультація'; l.hw=''; l.work=''; l.planIdx=null;
  });
}
function sylDiff(c,plan,start,all){
  const x=JSON.parse(JSON.stringify(c)); x.plan=plan; if(all) rewriteAll(x); else reflow(x,start);
  const old={}; c.lessons.forEach(l=>{old[l.id]=l.topic||'';});
  return sorted(x).filter(l=>l.status!=='cancelled'&&(all||l.status!=='done')).map(l=>({date:l.date,done:l.status==='done',old:old[l.id],neu:l.topic||'',changed:old[l.id]!==(l.topic||'')}));
}
/* Чи схожі теми проведених пар на цей силабус: спільні основи слів (перші 5 літер). */
function sylFit(c,plan){
  const st=t=>String(t||'').toLowerCase().replace(/^[а-яіїєґa-z]{1,3}\s*\d+[^\s.]*\.?\s*/i,'').split(/[^а-яіїєґa-z]+/).filter(w=>w.length>4).map(w=>w.slice(0,5));
  const S=plan.map(p=>new Set(st(p.title)));
  const D=c.lessons.filter(l=>l.status==='done'&&l.topic&&!/^Резерв/i.test(l.topic));
  const ok=D.filter(l=>{const w=st(l.topic); const need=Math.min(2,w.length); return need>0&&S.some(s=>w.filter(x=>s.has(x)).length>=need);}).length;
  return {ok,n:D.length,bad:D.length>=3&&ok*3<D.length};
}
function generate(c,from){
  const start=parse(from||todayISO()); const end=parse(c.semEnd||settings.semEnd||'2026-12-31');
  const have=new Set(c.lessons.map(l=>l.date+'|'+(l.pair||'')));
  const lastDate=c.lessons.reduce((m,l)=>l.date>m?l.date:m,'');
  let idx=nextPlanIdx(c), added=0;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const di=iso(d); if(di<=lastDate) continue;
    (c.schedule||[]).slice().sort((a,b)=>a.pair-b.pair).forEach(r=>{

/* ---------- journal layout ---------- */
function layout(c){
  const COLS=Number(c.cols)||18, ROWS=Number(c.rows)||20;
  const spreads=[]; let cols=[], rows=[];
  const flush=()=>{if(cols.length||rows.length) spreads.push({cols,rows}); cols=[];rows=[];};
  const add=(g,row)=>{ if(cols.length+g.length>COLS || (row&&rows.length>=ROWS)) flush(); cols=cols.concat(g); if(row) rows.push(row); };
  let n=0;
  sorted(c).forEach(l=>{
    if(l.status!=='cancelled'){
      n++; const g=[{t:dm(l.date),k:l.status==='done'?'date':'plan'}];
      if(isWork(l.work)){ if(workStyle(c)==='above'){ g[0].w=l.work; g[0].k+=' work'; } else g.push({t:l.work,k:'work'}); }
      add(g,{n,date:dm(l.date),topic:l.topic,hw:l.hw,planned:l.status!=='done'});
    }
    if(l.att) add([{t:'Атест. '+dm(l.date),k:'att'},{t:'',k:'reta'}]);   // атестація й чиста колонка для перездачі
  });
  add(endCols(c)); flush();
  return {spreads,COLS};
}
/* Кінець журналу: «Сем.» і перездача; якщо дисципліна продовжується в наступному семестрі — лише вони.
   Інакше ще [Іспит, перездача], [РР], [КР] і підсумкова «П». */
function endCols(c){
  const end=[{t:'Сем.',k:'fin'},{t:'',k:'ret'}];

  if(c.rr) end.push({t:'РР',k:'fin'});
  if(c.kr) end.push({t:'КР',k:'fin'});
  if(!c.continues) end.push({t:'П',k:'fin'});
  return end;
}

function spreadHTML(c,s,i,COLS){

  h+='</tr><tr class="num">'; for(let k=0;k<COLS;k++) h+='<td>'+(k+1)+'</td>'; h+='</tr></table></div>';
  h+='<div class="rp"><table><tr><th>№</th><th>Дата</th><th>Год</th><th>Тема</th><th>ДЗ</th></tr>';

function goTool(t,id){openTools.add(id);setTab(t,SUBS.includes(t)?t:undefined);const el=document.getElementById(id);if(el&&el.scrollIntoView)el.scrollIntoView({block:"start"});}

function renderChips(){
  const el=$('#courseChips'); const show=tab==='courses'&&order.length>0;
  el.hidden=!show; $('#subnav').hidden=!show;
  if(!order.length){el.innerHTML='';return;}
  el.innerHTML=order.map(id=>'<button class="chip" data-c="'+id+'" aria-pressed="'+(id===cur)+'">'+esc(courses[id].title)+' · '+esc(courses[id].groups)+'</button>').join('')+'<button class="chip" id="newCourse">+ Дисципліна</button>';
  el.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.c;try{localStorage.setItem('zh_cur',cur);}catch(e){}if(tab!=='courses')setTab('courses');else{renderChips();render();}}));
  $('#newCourse').addEventListener('click',createCourse);
}
function render(){
  const v=$('#view'); $('#foot').innerHTML=footHTML();
  if(!booted){ v.innerHTML='<div class="empty"><h2>Завантажую ваші дисципліни</h2><div class="note">Тут з\'являться пари на сьогодні, облік проведених занять і розкладка паперового журналу.</div></div>'; return; }
  if(!local&&!db){ v.innerHTML='<div class="empty"><h2>Сховище недоступне</h2><div>Відкрийте сторінку, увійшовши в claude.ai: записи зберігаються у вашому приватному розділі.</div></div>'; return; }
  if(!uid){ v.innerHTML='<div class="empty"><h2>Потрібен вхід</h2><div>Записи кожного викладача приватні, тому сторінка працює лише після входу.</div></div>'; return; }
  if(tab==='settings') return renderSettings(v);
  if(!order.length){ v.innerHTML=emptyHTML(); bindEmpty(); return; }
  if(tab==='today') return renderToday(v);
  const c=courses[cur]; if(!c){cur=order[0];return render();}
  if(sub==='lessons') return renderLessons(v,c);
  if(sub==='layout') return renderLayout(v,c);
  return renderCourse(v,c);
}

function renderToday(v){
  const t=todayISO(); const tm=addDays(t,1);
  const items=[]; order.forEach(id=>{const c=courses[id]; numbered(c).forEach(({l,n})=>{ if(l.date===t||l.date===tm) items.push({c,l,n}); });});
  items.sort((a,b)=>a.l.date<b.l.date?-1:a.l.date>b.l.date?1:(a.l.pair||0)-(b.l.pair||0));
  const overdue=[]; order.forEach(id=>{const c=courses[id]; c.lessons.forEach(l=>{ if(l.status==='planned'&&l.date<t) overdue.push({c,l}); });});
  overdue.sort((a,b)=>a.l.date<b.l.date?-1:1);
  let h=setupHTML()+'<div class="panel"><h2>Сьогодні й завтра</h2>';
  if(!items.length) h+='<div class="note">За розкладом пар немає. Якщо була заміна, внесіть її нижче або додайте пару у вкладці «Проведені пари».</div>';
  else h+='<div class="today">'+items.map(({c,l,n})=>'<div class="tcard"><div class="when">'+(l.date===t?'сьогодні':'завтра')+' · '+DOW[parse(l.date).getDay()]+' '+dm(l.date)+(l.pair?' · '+l.pair+' пара':'')+'</div><h3>'+esc(c.title)+' · '+esc(c.groups)+'</h3><div>'+(n?'№'+n+'. ':'')+esc(l.topic)+'</div><div class="row"><span class="pill '+l.status+'">'+stLabel(l.status)+'</span>'+(l.att?'<span class="pill att">після пари — атестація</span>':'')+(l.status!=='done'?'<button class="b pri" data-done="'+c.id+'|'+l.id+'">Проведено</button>':'')+(l.status==='planned'?'<button class="b ghost" data-cancel="'+c.id+'|'+l.id+'">Скасовано</button>':'')+'</div></div>').join('')+'</div>';
  h+=tool('t-sub','Внести заміни зі сторінки сайту',subToolHTML());
  h+='</div>';
  if(overdue.length){
    const by={}; overdue.forEach(({c,l})=>{(by[c.id]=by[c.id]||[]).push(l);});
    h+='<div class="panel"><h2>Не відмічені минулі пари: '+overdue.length+'</h2><div class="note">Відмітьте, чи вони відбулися, щоб нумерація й розкладка журналу були точними. Найточніше — звірити з переліком пар від навчальної частини. Якщо пари йшли за розкладом, можна відмітити всі разом'+(order.some(id=>by[id]&&!(courses[id].plan||[]).length)?'; але спершу додайте силабус, щоб у минулих парах стояли теми':'')+'.</div><div class="todo">'+
      order.filter(id=>by[id]).map(id=>{const c=courses[id], L=by[id]; return '<div><span><b>'+esc(c.title)+'</b> · '+esc(c.groups)+': '+L.length+' пар з '+dm(L[0].date)+' по '+dm(L[L.length-1].date)+'</span><span class="row"><button class="b" data-rec="'+id+'">Звірити з навчальною частиною</button><button class="b ghost" data-alldone="'+id+'">Усі минулі — проведені</button></span></div>';}).join('')+'</div>'+
      '<details class="tool" id="t-over"'+(openTools.has('t-over')?' open':'')+'><summary>Відмітити окремо</summary><div class="tbody lessons">'+overdue.map(({c,l})=>'<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule2);padding:6px 0"><span><span class="mono">'+dm(l.date)+'</span> · '+esc(c.title)+' · '+esc(c.groups)+' · '+esc(l.topic)+'</span><span class="row"><button class="b pri" data-done="'+c.id+'|'+l.id+'">Проведено</button><button class="b ghost" data-cancel="'+c.id+'|'+l.id+'">Не було</button></span></div>').join('')+'</div></details></div>'; }
  v.innerHTML=h; bindActs(v); bindTools(v); bindSub(v);
  v.querySelectorAll('[data-syl]').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.syl;try{localStorage.setItem('zh_cur',cur);}catch(e){} openTools.add('t-syl'); setTab('courses','course'); const el=document.getElementById('t-syl'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'start'});}));
  v.querySelectorAll('[data-sched]').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.sched; setTab('courses','course');}));
  const gs=$('#go-set'); if(gs) gs.addEventListener('click',()=>goTool('settings','t-sched'));
  v.querySelectorAll('[data-rec]').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.rec;goTool('lessons','t-rec');}));
  v.querySelectorAll('[data-alldone]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Точно всі? Натисніть ще раз';setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent='Усі минулі — проведені';}},4000);return;}
    const c=courses[b.dataset.alldone]; let n=0; c.lessons.forEach(l=>{if(l.status==='planned'&&l.date<t){l.status='done';n++;}}); scheduleSave(c.id); render(); toast(c.title+': відмічено проведеними '+n);}));
}
function setupHTML(){
  const rows=[];
  if(!settings.teacher) rows.push('<div><span>Оберіть себе в налаштуваннях, щоб серед замін розпізнавати пари, додані саме вам.</span><button class="b" id="go-set">До налаштувань</button></div>');
  order.forEach(id=>{const c=courses[id];
    if(!(c.schedule||[]).length) rows.push('<div><span><b>'+esc(c.title)+'</b> · '+esc(c.groups)+': немає розкладу пар</span><button class="b" data-sched="'+id+'">Задати розклад</button></div>');
    if(!(c.plan||[]).length) rows.push('<div><span><b>'+esc(c.title)+'</b> · '+esc(c.groups)+': немає тематичного плану, тому в парах замість тем «Резерв»</span><button class="b pri" data-syl="'+id+'">Додати силабус</button></div>'); });
  if(!rows.length) return '';
  return '<div class="panel"><h2>Що ще налаштувати</h2><div class="todo">'+rows.join('')+'</div></div>';
}
function subToolHTML(){
  const date=draft.subDate||addDays(todayISO(),1);
  let h='<div class="note">Відкрийте <a href="'+SITE.zam+'" target="_blank" rel="noopener">розпорядження про заміни</a>, виділіть таблицю від «Група» до кінця, скопіюйте й вставте сюди. Застосунок знайде рядки ваших груп і дисциплін.'+(settings.teacher?'':' Щоб розпізнавати пари, додані саме вам, вкажіть прізвище в «Налаштуваннях».')+'</div>'+
    '<label class="f" style="max-width:11rem">Дата, на яку заміни<input type="date" id="sub-date" value="'+esc(date)+'"></label>'+
    '<textarea id="sub-text" style="min-height:120px" placeholder="Група	Пара	–	Заміна	Ауд">'+esc(draft.subText)+'</textarea><div class="row"><button class="b" id="sub-go">Розпізнати</button></div>';
  const s=draft.sub; if(!s) return h;
  if(!s.length) return h+'<div class="note">Рядків, що стосуються ваших дисциплін, не знайдено.</div>';
  h+='<div class="prev">'+s.map((x,i)=>{const c=courses[x.cid];const txt=x.type==='add'?'додати '+x.pair+' пару':'скасувати '+x.pair+' пару'+(x.lid?'':' (у журналі її немає)');
    return '<label><input type="checkbox" data-sub="'+i+'"'+(x.type==='cancel'&&!x.lid?' disabled':' checked')+'><span><b class="op-'+x.type+'">'+txt+'</b> · '+esc(c.title)+' · '+esc(c.groups)+'<br><span class="sub">'+esc(x.row.groups.join(', '))+' · '+esc(x.row.from)+' → '+esc(x.row.to)+'</span></span></label>';}).join('')+'</div><div class="row"><button class="b pri" id="sub-apply">Застосувати на '+dm(date)+'</button></div>';
  return h;
}
function bindSub(v){
  const tx=$('#sub-text'); if(!tx) return;
  tx.addEventListener('input',()=>{draft.subText=tx.value;});
  $('#sub-date').addEventListener('change',e=>{draft.subDate=e.target.value;draft.sub=null;render();});
  $('#sub-go').addEventListener('click',()=>{
    draft.subText=tx.value; const date=$('#sub-date').value||addDays(todayISO(),1); draft.subDate=date;
    const rows=P.parseSubstitutions(tx.value); const res=[];
    rows.forEach(row=>order.forEach(id=>{const c=courses[id]; const ef=P.substitutionEffect(row,c,settings.teacher); if(!ef) return;
      if(res.some(r=>r.cid===id&&r.pair===row.pair&&r.type===ef)) return;
      const ex=c.lessons.find(l=>l.date===date&&l.status!=='cancelled'&&(l.pair===row.pair||!l.pair));
      if(ef==='add'&&ex) return;
      res.push({cid:id,type:ef,pair:row.pair,row,lid:ef==='cancel'&&ex?ex.id:null});}));
    if(!rows.length) toast('Не бачу таблиці замін. Скопіюйте її разом із колонками «Група» і «Пара».');
    draft.sub=res; render();
  });
  const ap=$('#sub-apply'); if(ap) ap.addEventListener('click',()=>{
    const date=draft.subDate; const touched=new Set(); let n=0;
    v.querySelectorAll('[data-sub]').forEach(cb=>{ if(!cb.checked) return; const x=draft.sub[Number(cb.dataset.sub)]; const c=courses[x.cid];
      if(x.type==='cancel'){ const l=c.lessons.find(y=>y.id===x.lid); if(l){l.status='cancelled';n++;} }
      else { c.lessons.push(lessonFromPlan(c,date,x.pair,nextPlanIdx(c))); n++; }
      touched.add(x.cid); });
    touched.forEach(id=>{reflow(courses[id]);scheduleSave(id);});
    draft.sub=null; draft.subText=''; render(); toast(n?'Внесено змін: '+n:'Нічого не вибрано');
  });
}
function stLabel(s){return s==='done'?'проведено':s==='cancelled'?'скасовано':'за планом';}
function bindActs(v){
  v.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>setSt(b.dataset.done,'done')));
  v.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>setSt(b.dataset.cancel,'cancelled')));
  v.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>setSt(b.dataset.plan,'planned')));
  v.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delLesson(b.dataset.del)));
  v.querySelectorAll('[data-att]').forEach(b=>b.addEventListener('click',()=>{const [cid,id]=b.dataset.att.split('|');const c=courses[cid];const l=c.lessons.find(x=>x.id===id);if(!l)return;
    if(l.att) delete l.att; else l.att=true; scheduleSave(cid); render(); toast(l.att?'Атестація після пари '+dm(l.date)+': у журналі колонки «Атест.» і перездача':'Атестацію прибрано');}));
}
function setSt(key,st){const [cid,lid_]=key.split('|');const c=courses[cid];const l=c.lessons.find(x=>x.id===lid_);if(!l)return;const prev=l.status;l.status=st;
  if(prev==='cancelled'||st==='cancelled') reflow(c);
  scheduleSave(cid);render();toast(st==='done'?'Відмічено: проведено':st==='cancelled'?'Відмічено: не відбулася. Теми далі зсунулись':'Повернуто в план');}
function delLesson(key){const [cid,lid_]=key.split('|');const c=courses[cid];const l=c.lessons.find(x=>x.id===lid_);if(!l)return;
  const btn=document.querySelector('[data-del="'+key+'"]'); if(btn&&btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='Точно?';setTimeout(()=>{if(btn.isConnected){btn.dataset.armed='';btn.textContent='Видалити';}},3000);return;}
  c.lessons=c.lessons.filter(x=>x.id!==lid_);reflow(c);scheduleSave(cid);render();toast('Пару видалено');}

/* ----- Проведені пари ----- */
function renderLessons(v,c){
  const nb=numbered(c); const done=c.lessons.filter(l=>l.status==='done').length; const pl=c.lessons.filter(l=>l.status==='planned').length;
  const planN=(c.plan||[]).length;

    '<div class="row"><button class="b" id="gen">Дозаповнити за розкладом</button></div></div>'+
    '<form class="row" id="addForm"><label class="f" style="width:9.5rem">Додати пару (заміна)<input type="date" id="addDate" required></label><label class="f" style="width:5rem">Пара<input type="number" id="addPair" min="1" max="8"></label><button class="b pri" type="submit">Додати</button></form>'+
    tool('t-rec','Звірити з переліком пар від навчальної частини',recToolHTML(c))+
    '<div class="note">Щоб перенести пару, натисніть на її дату. Тему можна переписати вручну; щоб повернути тему з плану, зітріть поле.</div>'+
    '<div class="lessons"><div class="lesson lhead"><span>№</span><span>Дата</span><span class="pair">Пара</span><span>Тема</span><span>ДЗ</span><span>Колонка</span><span></span></div>';
  nb.forEach(({l,n})=>{
    const k=c.id+'|'+l.id;
    h+='<div class="lesson '+l.status+'" data-l="'+l.id+'"><span class="n mono">'+(n||'—')+'</span><button class="d mono" data-mv="'+l.id+'" title="Перенести пару">'+dm(l.date)+' <span class="sub">'+DOW[parse(l.date).getDay()]+'</span></button><span class="pair mono sub">'+(l.pair||'')+'</span>'+
      '<input class="topic" value="'+esc(l.topic)+'" aria-label="Тема" title="'+(l.custom?'Тему вписано вручну':'Тема з плану')+'">'+
      '<input class="hw" value="'+esc(l.hw)+'" aria-label="ДЗ" placeholder="ДЗ">'+
      '<input class="wl" value="'+esc(l.work)+'" aria-label="Колонка роботи" placeholder="ПЗ/ЛР">'+

function reconcile(c,items){
  const t=todayISO(); const ds=items.map(x=>x.date).sort(); const from=ds[0], to=ds[ds.length-1];
  const inRange=sorted(c).filter(l=>l.date>=from&&l.date<=to); const used=new Set(); const ops=[];
  items.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(it=>{
    const cand=inRange.filter(l=>!used.has(l.id)&&l.date===it.date&&(it.pair==null||l.pair==null||l.pair===it.pair)).sort((a,b)=>(a.status==='cancelled')-(b.status==='cancelled'));
    const l=cand[0];
    if(!l){ ops.push({type:'add',date:it.date,pair:it.pair}); return; }
    used.add(l.id);
    if(l.status==='cancelled') ops.push({type:it.date<=t?'done':'restore',date:l.date,pair:l.pair,lid:l.id,topic:l.topic,fromCancel:true});
    else if(l.status==='planned'&&it.date<=t) ops.push({type:'done',date:l.date,pair:l.pair,lid:l.id,topic:l.topic});
  });
  inRange.forEach(l=>{ if(!used.has(l.id)&&l.status!=='cancelled') ops.push({type:'cancel',date:l.date,pair:l.pair,lid:l.id,topic:l.topic}); });
  ops.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return {from,to,ops};
}
function bindRec(v,c){
  const tx=$('#rec-text'); if(!tx) return;
  tx.addEventListener('input',()=>{(draft.rec[c.id]=draft.rec[c.id]||{}).text=tx.value;});
  $('#rec-go').addEventListener('click',()=>{
    const items=P.parseDateList(tx.value); if(!items.length){toast('Не бачу жодної дати. Формат: 02.09 або 02.09.2026');return;}
    draft.rec[c.id]=Object.assign({text:tx.value},reconcile(c,items)); render();
  });
  const ap=$('#rec-apply'); if(ap) ap.addEventListener('click',()=>{
    const d=draft.rec[c.id]; const t=todayISO(); const chosen=[]; v.querySelectorAll('[data-op]').forEach(cb=>{if(cb.checked) chosen.push(d.ops[Number(cb.dataset.op)]);});
    const markDone=[];
    chosen.forEach(o=>{
      if(o.type==='add'){ const l=lessonFromPlan(c,o.date,o.pair,nextPlanIdx(c)); c.lessons.push(l); if(o.date<=t) markDone.push(l.id); }
      else { const l=c.lessons.find(x=>x.id===o.lid); if(!l) return;
        if(o.type==='cancel') l.status='cancelled';
        else if(o.type==='restore') l.status='planned';
        else if(o.type==='done'){ if(l.status==='cancelled') l.status='planned'; markDone.push(l.id); } }
    });
    reflow(c);                                    // спершу теми стають у чергу, потім пари позначаємо проведеними
    markDone.forEach(id=>{const l=c.lessons.find(x=>x.id===id); if(l) l.status='done';});
    delete draft.rec[c.id]; scheduleSave(c.id); render(); toast('Звірено: змін '+chosen.length);
  });
}

/* PDF для друку: A4 альбомна, один розворот журналу на сторінку, чорне на білому незалежно від теми */
async function loadPdfLibs(){
  if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!(window.pdfMake&&window.pdfMake.vfs)) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js');   // Roboto з кирилицею
}
async function layoutPDF(c){
  await loadPdfLibs();
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}); const vfs=window.pdfMake.vfs;
  [['Roboto-Regular.ttf','normal'],['Roboto-Medium.ttf','bold'],['Roboto-Italic.ttf','italic']].forEach(([f,st])=>{doc.addFileToVFS(f,vfs[f]);doc.addFont(f,'Roboto',st);});
  doc.setFont('Roboto','normal'); doc.setTextColor(0); doc.setDrawColor(0); doc.setLineWidth(0.2);
  const {spreads,COLS}=layout(c); const ROWS=Number(c.rows)||20, M=8, W=297, H=210, MID=W/2, top=M+8;
  const cell=(x,y,w,h)=>doc.rect(x,y,w,h);
  spreads.forEach((s,si)=>{
    if(si) doc.addPage();
    doc.setFont('Roboto','bold'); doc.setFontSize(10); doc.text(c.title+' · '+c.groups,M,M+3);
    doc.setFont('Roboto','normal'); doc.setFontSize(8); doc.text('Розворот '+(si+1)+' з '+spreads.length,MID-4,M+3,{align:'right'}); doc.text('Права сторінка',MID+4,M+3);
    // ліва сторінка: шапка з вертикальними датами, номери колонок і порожні рядки для студентів
    const lw=MID-4-M, cw=lw/COLS, hh=34, nh=4.5;
    for(let k=0;k<COLS;k++){ const x=M+k*cw, it=s.cols[k]; cell(x,top,cw,hh); cell(x,top+hh,cw,nh);
      doc.setFontSize(6.5); doc.text(String(k+1),x+cw/2,top+hh+3.2,{align:'center'});
      if(it){ const txt=it.t||'перездача'; const strong=/fin|att/.test(it.k), work=/work/.test(it.k)&&!it.w;
        doc.setFont('Roboto',it.t?(strong||work?'bold':'normal'):'italic'); doc.setFontSize(it.t?8:7);
        doc.text(txt,x+cw/2+1.3,top+hh-2,{angle:90});
        if(it.w){ doc.setFont('Roboto','bold'); doc.text(it.w,x+cw/2+1.3,top+hh-2-doc.getTextWidth(txt)-2.5,{angle:90}); }
        doc.setFont('Roboto','normal'); } }
    const sy=top+hh+nh, rh=5.2; for(let y=sy;y+rh<=H-M+0.01;y+=rh) for(let k=0;k<COLS;k++) cell(M+k*cw,y,cw,rh);
    // права сторінка: №, дата, години, тема, ДЗ
    const x0=MID+4, cols=[['№',8],['Дата',13],['Год',8],['Тема',0],['ДЗ',38]]; const free=W-M-x0-cols.reduce((a,b)=>a+b[1],0); cols[3][1]=free;
    const th=6, rH=(H-M-top-th)/ROWS; let x=x0; doc.setFont('Roboto','bold'); doc.setFontSize(8);
    cols.forEach(([t,w])=>{cell(x,top,w,th);doc.text(t,x+1.2,top+4.2);x+=w;}); doc.setFont('Roboto','normal');
    for(let r=0;r<ROWS;r++){ const y=top+th+r*rH, row=s.rows[r]; x=x0;
      cols.forEach(([t,w],ci)=>{ cell(x,y,w,rH); if(row){ const v=[row.n,row.date,c.hours||2,row.topic,row.hw][ci]; let fs=7.5; doc.setFontSize(fs);
          let lines=doc.splitTextToSize(String(v==null?'':v),w-2); const maxL=Math.max(1,Math.floor((rH-1)/2.9));
          while(lines.length>maxL&&fs>5.5){fs-=0.5;doc.setFontSize(fs);lines=doc.splitTextToSize(String(v),w-2);}
          if(lines.length>maxL){lines=lines.slice(0,maxL);lines[maxL-1]=lines[maxL-1].replace(/.{0,2}$/,'…');}
          doc.text(lines,x+1,y+Math.min(rH/2+1.2,3.3)-(lines.length>1?0.6*(lines.length-1)*0:0)); } x+=w; }); }
  });
  return doc.output('arraybuffer');   // ArrayBuffer передається в будь-якому клієнті claude.ai надійніше за Blob
}
async function saveLayout(c){
  const b=$('#dl'); const st=$('#dl-st'); const say=t=>{ if(st) st.textContent=t; };
  if(b){b.disabled=true;b.textContent='Готую PDF…';} say('');
  const name='zhurnal_'+(c.short||c.title).replace(/[^\wа-яіїєґ-]+/gi,'_')+'.pdf';
  try{
    const buf=await layoutPDF(c);
    if(downloads){
      try{ const r=await downloads.save({filename:name,data:buf});
        say(r&&r.status==='delivered'?'Файл передано туди, куди ви обрали.':'Файл '+name+' збережено в завантаження браузера. Друкуйте на A4 альбомно, без масштабування.'); }
      catch(e){ const code=e&&e.code||'помилка'; say(code==='declined'||code==='cancelled'?'Збереження скасовано.':'Браузер не зберіг файл ('+code+'). Спробуйте ще раз або відкрийте журнал на https://dl-kfk.github.io/kfk_journal/ через резервну копію.'); }
    } else {
      const url=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
      const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      if(st) st.innerHTML='Файл '+esc(name)+' має з\'явитися в завантаженнях. Якщо його немає — <a href="'+url+'" target="_blank" rel="noopener">відкрийте PDF</a> і збережіть або надрукуйте з переглядача.';
    }
  }catch(e){ say('Не вдалося створити PDF: '+((e&&e.message)||'помилка')+'. Перевірте з\'єднання з інтернетом: бібліотеки PDF вантажаться з cdnjs.'); }
  if(b){b.disabled=false;b.textContent='Зберегти PDF для друку';}
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Не вдалося завантажити бібліотеку'));document.head.appendChild(s);});}
async function docxText(buf){
  if(!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const z=await window.JSZip.loadAsync(buf); const f=z.file('word/document.xml'); if(!f) throw new Error('Це не документ Word (.docx)');
  const d=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main'; const out=[];
  const ptext=p=>Array.from(p.getElementsByTagNameNS(W,'t')).map(t=>t.textContent).join('');
  const walk=el=>{ for(const ch of Array.from(el.children)){
    if(ch.localName==='p') out.push(ptext(ch));
    else if(ch.localName==='tbl'){ for(const tr of Array.from(ch.children)){ if(tr.localName!=='tr') continue;
      out.push(Array.from(tr.children).filter(x=>x.localName==='tc').map(tc=>Array.from(tc.getElementsByTagNameNS(W,'p')).map(ptext).join('\n')).join(' ')); } }
    else if(ch.localName==='sdt'){ const sc=ch.getElementsByTagNameNS(W,'sdtContent')[0]; if(sc) walk(sc); } } };
  walk(d.getElementsByTagNameNS(W,'body')[0]); return out.join('\n');
}
async function pdfText(buf){
  if(!window.pdfjsLib){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'); }
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise; const lines=[];
  for(let p=1;p<=doc.numPages;p++){ const tc=await (await doc.getPage(p)).getTextContent(); const rows=[];
    tc.items.forEach(it=>{ if(!it.str) return; const y=it.transform[5]; let r=rows.find(r=>Math.abs(r.y-y)<=2.5); if(!r){r={y,items:[]};rows.push(r);}
      r.items.push({x:it.transform[4],w:it.width||0,h:Math.abs(it.transform[3])||it.height||10,s:it.str}); });
    // pdf.js ріже слова й номери на шматки («Л», «1», «1.»): пробіл ставимо лише там, де між шматками є проміжок
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{ let t='', end=null;
      r.items.sort((a,b)=>a.x-b.x).forEach(i=>{ if(!i.s.trim()){ t+=' '; end=i.x+i.w; return; }
        if(end!==null && i.x-end>i.h*0.18 && !/\s$/.test(t)) t+=' ';
        t+=i.s; end=i.x+i.w; });
      lines.push(t.replace(/\s+/g,' ').trim()); }); }
  return lines.join('\n');
}

function bindSyl(v,c){
  const d=draft.syl[c.id]=draft.syl[c.id]||{};
  const pickSem=sems=>{ const autumn=new Date().getMonth()>=7; const i=sems.findIndex(s=>s.n&&(s.n%2===1)===autumn); return i<0?0:i; };
  const done=(sems,status)=>{d.sems=sems;d.semIdx=pickSem(sems);d.start=null;d.all=false;d.status=status;openTools.add('t-syl');render();};
  $('#syl-text').addEventListener('input',e=>{d.paste=e.target.value;});
  $('#syl-file').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return; const st=$('#syl-st'); st.textContent='читаю '+f.name+'…';
    try{
      const name=f.name.toLowerCase(); let text;
      if(name.endsWith('.doc')) throw new Error('Старий формат .doc: збережіть файл у Word як .docx');
      if(name.endsWith('.docx')) text=await docxText(await f.arrayBuffer());
      else if(name.endsWith('.pdf')) text=await pdfText(await f.arrayBuffer());
      else text=await f.text();
      const sems=P.parseSyllabus(text); done(sems,f.name+': знайдено '+sems.reduce((a,s)=>a+s.items.length,0)+' пунктів');
    }catch(err){ st.textContent=(err&&err.message)||'Не вдалося прочитати файл'; }
  });
  $('#syl-parse').addEventListener('click',()=>{const t=$('#syl-text').value; if(!t.trim()){toast('Вставте текст розділу 7.1');return;} done(P.parseSyllabus(t),'з вставленого тексту');});
  const ss=$('#syl-sem'); if(ss) ss.addEventListener('change',()=>{d.semIdx=Number(ss.value);d.start=null;render();});
  const si=$('#syl-start'); if(si) si.addEventListener('change',()=>{d.start=Number(si.value)||1;render();});
  const sa=$('#syl-all'); if(sa) sa.addEventListener('change',()=>{d.all=sa.checked;render();});

  const ap=$('#syl-apply'); if(ap) ap.addEventListener('click',()=>{
    const plan=curPlan(); const start=Math.max(1,Math.min(Number($('#syl-start').value)||1,plan.length+1))-1;
    c.plan=plan; if(d.all) rewriteAll(c); else reflow(c,start); const a=d.all; delete draft.syl[c.id]; openTools.delete('t-syl'); scheduleSave(c.id); render(); toast('План записано ('+plan.length+' занять), '+(a?'теми всіх пар переписано':'майбутні пари оновлено'));
  });
  const po=$('#syl-plan'); if(po) po.addEventListener('click',()=>{
    c.plan=curPlan(); delete draft.syl[c.id]; openTools.delete('t-syl'); scheduleSave(c.id); render(); toast('План записано ('+c.plan.length+' занять). Пари не змінено');
  });
}

    toast('Збережено');
  });
  const ex=$('#s-exp'); if(ex) ex.addEventListener('click',async()=>{
    const data=JSON.stringify({app:'zhurnal-vykladacha',version:1,saved:new Date().toISOString(),settings,courses:order.map(id=>courses[id])},null,1);
    const r=await saveFile('zhurnal_kopiya_'+todayISO()+'.json',data,'application/json'); if(r==='saved') toast('Копію збережено'); else if(r===null) toast('Копію не збережено');
  });
  $('#s-imp').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ const j=JSON.parse(await f.text()); if(!j||!Array.isArray(j.courses)) throw 0; draft.backup=j; render(); }catch(err){ toast('Це не резервна копія журналу'); } });
  const ri=$('#s-restore'); if(ri) ri.addEventListener('click',()=>{
    const j=draft.backup; let n=0; j.courses.forEach(c0=>{ if(!c0||!Array.isArray(c0.lessons)) return; const c=JSON.parse(JSON.stringify(c0)); const id=c.id||newId(); c.id=id; courses[id]=c; if(!order.includes(id)) order.push(id); scheduleSave(id); n++; });
    if(j.settings){ settings=Object.assign(settings,j.settings); scheduleSave('_settings'); }
    draft.backup=null; cur=cur||order[0]; renderChips(); render(); toast('Відновлено дисциплін: '+n);
  });
  const rc=$('#s-restore-x'); if(rc) rc.addEventListener('click',()=>{draft.backup=null;render();});
}
function backupHTML(){
  const j=draft.backup; if(!j) return '';
  const same=j.courses.filter(c=>c&&courses[c.id]).length;
  return '<div class="note">У файлі '+j.courses.length+' дисциплін'+(j.saved?' від '+esc(String(j.saved).slice(0,10)):'')+'. '+(same?'Дисципліни, які вже є тут ('+same+'), буде замінено версією з файлу.':'Їх буде додано до наявних.')+'</div><div class="row"><button class="b pri" id="s-restore">Відновити</button><button class="b ghost" id="s-restore-x">Скасувати</button></div>';
}
function schedToolHTML(){
  let h='';
  if(!kfk) h+=fld('s-teacher','Прізвище та ініціали, як на сайті коледжу',settings.teacher);
  if(kfk) h+=teacherSelectHTML('s-who')+'<div class="sub">Розклад коледжу станом на '+fetchedText()+'. Якщо відтоді він змінився, вставте таблицю з сайту вручну (нижче).</div>';
  h+=(kfk?'<details class="tool inner" id="t-paste"'+(openTools.has('t-paste')?' open':'')+'><summary>Вставити розклад із сайту вручну</summary><div class="tbody">':'')+'<ol class="steps left"><li><span>Відкрийте <a href="'+SITE.college+'" target="_blank" rel="noopener">розклад викладача коледжу</a>, оберіть себе й натисніть OK.</span></li>'+
    '<li><span>Виділіть таблицю мишею від «Предмет» до останнього рядка, скопіюйте й вставте нижче.</span></li>'+
    '<li><span>Натисніть «Розпізнати», перевірте назви й номери пар і створіть дисципліни.</span></li></ol>'+
    '<textarea id="s-sched" style="min-height:140px" placeholder="Предмет	Викладач	Група	Ауд.	Пара	День">'+esc(draft.schedText)+'</textarea><div class="row"><button class="b" id="s-parse">Розпізнати</button></div>'+(kfk?'</div></details>':'');
  const cl=draft.sched; if(!cl) return h;
  if(!cl.length) return h+'<div class="note">'+(draft.schedFrom?'У розкладі '+esc(draft.schedFrom)+' немає пар.':'Не бачу рядків розкладу. Скопіюйте таблицю разом із колонками «Пара» і «День».')+'</div>';
  h+='<div class="sub">'+(draft.schedFrom?esc(draft.schedFrom)+': ':'')+'знайдено дисциплін '+cl.length+'. Перевірте назви, групи й пари; зніміть позначку з того, що вести тут не треба.</div><div class="prev">';
  cl.forEach((x,i)=>{
    const match=order.find(id=>P.groupsOverlap(courses[id].groups,x.groups)&&P.nameMatch(courses[id].title,x.subject));
    h+='<div class="cl"><input type="checkbox" data-ci="'+i+'" checked aria-label="Взяти"><div class="grid2" style="gap:6px"><label class="f">Назва<input data-ct="'+i+'" value="'+esc(x.subject)+'"></label><label class="f">Групи<input data-cg="'+i+'" value="'+esc(x.groups)+'"></label></div>'+
      '<label class="f">'+x.slots.map(slotText).join(' · ')+(x.aud?' · ауд. '+esc(x.aud):'')+'<select data-cs="'+i+'"><option value="new">створити нову дисципліну</option>'+order.map(id=>'<option value="'+id+'"'+(id===match?' selected':'')+'>оновити розклад: '+esc(courses[id].title)+' · '+esc(courses[id].groups)+'</option>').join('')+'</select></label></div>';
  });
  h+='</div><label class="f" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="s-gen" checked> для нових дисциплін одразу створити пари з '+dm(settings.semStart)+' до '+dm(settings.semEnd)+'</label>'+
    '<label class="f" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="s-rebuild" checked> для наявних перебудувати майбутні пари за новим розкладом (проведені не зміняться)</label>'+
    '<div class="row"><button class="b pri" id="s-apply">Застосувати розклад</button></div>';
  return h;
}
function bindSched(v){
  const tn=$('#s-teacher'); if(tn) tn.addEventListener('change',()=>{settings.teacher=tn.value.trim(); scheduleSave('_settings'); toast('Прізвище збережено');});
  const tx=$('#s-sched'); if(!tx) return;
  tx.addEventListener('input',()=>{draft.schedText=tx.value;});
  const who=$('#s-who'); if(who) who.addEventListener('change',()=>{ if(!who.value){draft.sched=null;render();return;} pickTeacher(who.value); render(); });
  $('#s-parse').addEventListener('click',()=>{draft.schedText=tx.value; draft.schedFrom=''; draft.sched=P.clusterCourses(P.parseTeacherSchedule(tx.value)); render();});
  const ap=$('#s-apply'); if(!ap) return;
  ap.addEventListener('click',()=>{
    const gen=$('#s-gen').checked, rebuild=$('#s-rebuild').checked; let made=0, upd=0;
    draft.sched.forEach((x,i)=>{
      if(!v.querySelector('[data-ci="'+i+'"]').checked) return;
      const title=v.querySelector('[data-ct="'+i+'"]').value.trim()||x.subject, groups=v.querySelector('[data-cg="'+i+'"]').value.trim()||x.groups, target=v.querySelector('[data-cs="'+i+'"]').value;
      const slots=x.slots.map(s=>({dow:s.dow,pair:s.pair,parity:s.parity}));
      if(target==='new'){ const c=newCourse({title,groups,schedule:slots,aud:x.aud||''}); if(gen){ generate(c,c.semStart); applyAttDates(c,settings.attDates); } made++; cur=cur||c.id; }
      else { const c=courses[target]; c.schedule=slots; if(rebuild){ const t=todayISO(); c.lessons=c.lessons.filter(l=>!(l.status==='planned'&&l.date>t&&!l.custom)); generate(c,addDays(t,1)); reflow(c); } scheduleSave(c.id); upd++; }
    });
    draft.sched=null; draft.schedText=''; draft.schedFrom=''; if(!cur) cur=order[0]; setTab('today');
    toast('Створено дисциплін: '+made+(upd?', оновлено: '+upd:'')+'. Далі — силабуси: див. «Що ще налаштувати»');
  });
}

function teacherSelectHTML(id){
  if(!kfk) return '';
  const names=Object.keys(kfk.teachers).sort((a,b)=>a.localeCompare(b,'uk'));
  return '<label class="f who">Хто ви?<select id="'+id+'"><option value="">— оберіть себе зі списку викладачів коледжу —</option>'+names.map(n=>'<option'+(n===settings.teacher?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label>';
}
function pickTeacher(name){
  settings.teacher=name; scheduleSave('_settings');
  const rows=(kfk&&kfk.teachers[name])||[];
  draft.schedText=''; draft.schedFrom=name;
  draft.sched=P.clusterCourses(P.parseTeacherSchedule(rows.map(r=>r.join('\t')).join('\n')));
}
function fetchedText(){ if(!kfk||!kfk.fetched) return ''; const [y,m,d]=kfk.fetched.split('-'); return d+'.'+m+'.'+y; }
function createCourse(){ const c=newCourse(); cur=c.id; setTab('courses','course'); }
async function importSeed(){
  try{
    const snap=await db.collection('seed').get(); if(snap.empty){toast('Немає даних для імпорту');return;}
    for(const d of snap.docs){ const c=JSON.parse(JSON.stringify(d.data())); const id=d.id; c.id=id; courses[id]=c; if(!order.includes(id)) order.push(id); await store.set(id,c); }
    cur=order[0]; renderChips(); render(); toast('Імпортовано дисциплін: '+snap.size);
  }catch(e){toast('Не вдалося імпортувати');}
}

/* ---------- boot ---------- */
render();
// знімок розкладу необов'язковий: без нього лишається ручна вставка; старт не чекає довше 4 с
const kfkLoad=Promise.race([
  (typeof fetch==='function'?fetch('kfk_rozklad.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.teachers) kfk=j; }):Promise.resolve()).catch(()=>{}),
  new Promise(r=>setTimeout(r,4000))]);
(async()=>{
  const cl=window.claude;
  local=!(cl&&typeof cl.use==='function');
  if(!local){
    try{ [db,user,downloads]=await Promise.all([cl.use('db'),cl.use('user'),cl.use('downloads')]); }catch(e){}
    if(user){ try{uid=await user.id();}catch(e){} try{owner=!!(await user.isOwner());}catch(e){} }
  } else uid='local';
  await kfkLoad;
  booted=true;
  if(!local&&(!db||!uid)){ setStatus('офлайн'); render(); return; }
  try{
    const docs=await store.all(); const migrated=[];
    docs.forEach(({id,data})=>{
      if(id==='_settings'){ if(data) settings=Object.assign(settings,data); return; }
      if(!data||!Array.isArray(data.lessons)) return;
      const c=JSON.parse(JSON.stringify(data)); c.id=id; courses[id]=c;
      if(c.attDate&&!c.attMig){ markAttOn(c,c.attDate); c.attMig=true; migrated.push(id); } });
    if(settings.attDate&&!(settings.attDates||[]).length){ settings.attDates=[settings.attDate]; migrated.push('_settings'); }
    migrated.forEach(id=>scheduleSave(id));
    order=Object.keys(courses).sort((a,b)=>(courses[a].created||0)-(courses[b].created||0));
    let saved=null; try{saved=localStorage.getItem('zh_cur');}catch(e){}
    cur=order.includes(saved)?saved:order[0]||null;
    setStatus(local?'записи в цьому браузері':(order.length?'збережено':''));
  }catch(e){ setStatus('помилка читання'); }
  renderChips(); render();
})();
})();
</script>
